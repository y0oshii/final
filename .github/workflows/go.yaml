name: final
on:
  push:
    branches: [ main ]
    
jobs:
  test:
    runs-on: ubuntu-latest
    container: golang:1.25.1
    steps:
      - uses: actions/checkout@v4

      - name: Run Unit Tests
        run: GOOS=linux GOARCH=amd64 go test

      - name: Vet
        run: |
          go vet ./...
      
  publish:
    needs: test
    runs-on: ubuntu-latest
    
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.ref_name }} .

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.ref_name }}