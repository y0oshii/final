name: final
on: push
jobs:
    test:
         runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v3
        - uses: actions/setup-go@v4
        
        - name: Test
        run: go test -v ./...
    
    publish:
    needs: test
    runs-on: ubuntu-latest
    
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.ref_name }} .

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.ref_name }}
